name: HW5 Tests

on:
  push:
    paths:
      - 'hw4/**'
      - '.github/workflows/hw5-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hw4/**'
      - '.github/workflows/hw5-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: hw4/hw
    env:
      DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests with minimum 95% coverage
        run: python -m pytest -v --cov=shop_api --cov=storage --cov-branch --cov-report=term-missing --cov-fail-under=95
